# Gera o APK do ALONE DAYS automaticamente no GitHub.
# Roda a cada push na branch main (ou manualmente em Actions > "Build Android APK" > Run workflow).
# O APK fica em Releases > "APK mais recente" — dá para baixar direto pelo celular.
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache do Godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Instalar Godot e modelos de exportação
        run: |
          if [ ! -x ~/godot/godot ]; then
            mkdir -p ~/godot && cd ~/godot
            curl -sSL -o g.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -q g.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot && rm g.zip
          fi
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          if [ ! -f "$T/android_debug.apk" ]; then
            mkdir -p "$T"
            curl -sSL -o /tmp/t.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            unzip -q /tmp/t.tpz -d /tmp/t && mv /tmp/t/templates/* "$T/"
          fi

      - name: Importar projeto e configurar Android SDK
        run: |
          ~/godot/godot --headless --path . --import || true
          SETTINGS=$(ls ~/.config/godot/editor_settings-*.tres | head -1)
          echo "Editor settings: $SETTINGS"
          python3 - "$SETTINGS" "$ANDROID_HOME" "$JAVA_HOME" <<'EOF'
          import re, sys
          path, sdk, java = sys.argv[1:4]
          text = open(path).read()
          for key, value in (("export/android/android_sdk_path", sdk), ("export/android/java_sdk_path", java)):
              line = f'{key} = "{value}"'
              if re.search(rf"^{re.escape(key)} = .*$", text, re.M):
                  text = re.sub(rf"^{re.escape(key)} = .*$", line, text, flags=re.M)
              else:
                  text = text.rstrip("\n") + "\n" + line + "\n"
          open(path, "w").write(text)
          EOF

      - name: Testes automáticos
        run: ~/godot/godot --headless --path . res://tools/smoke_test.tscn

      - name: Chave de assinatura (debug)
        run: keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Exportar APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          ~/godot/godot --headless --path . --export-debug "Android" build/AloneDays.apk
          test -f build/AloneDays.apk
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: AloneDays-apk
          path: build/AloneDays.apk

      - name: Publicar em Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk -y --cleanup-tag || true
          gh release create latest-apk build/AloneDays.apk --prerelease \
            --title "APK mais recente" \
            --notes "Build automático do commit ${GITHUB_SHA::7}. Baixe o AloneDays.apk e instale no celular."
